# Nginx Config Snippet untuk PDAM Chatbot
# Salin blok "location /chatbot-api/" ini ke dalam server block website Laravel yang sudah ada
# Biasanya di: /etc/nginx/sites-available/pdampurbalingga.co.id

# ──────────────────────────────────────────────────────────────────────────────
# TAMBAHKAN blok ini di dalam server block { ... } yang sudah ada
# ──────────────────────────────────────────────────────────────────────────────

location /chatbot-api/ {
    # Teruskan request ke FastAPI yang berjalan di port 8001 (lokal, tidak publik)
    proxy_pass http://127.0.0.1:8001/;

    # Header standar untuk reverse proxy
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeout lebih panjang karena AI bisa lambat (maks 120 detik)
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;

    # Header CORS tidak perlu ditambahkan di sini — sudah dihandle oleh FastAPI
}

# ──────────────────────────────────────────────────────────────────────────────
# CONTOH LENGKAP server block (jika belum ada konfigurasi Nginx sama sekali)
# ──────────────────────────────────────────────────────────────────────────────

